<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ba3f7"/>
      <stop offset="1" stop-color="#4a7de8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Tile: 880px square inset 72px -->
  <rect x="72" y="72" width="880" height="880" rx="196" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="196" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- Play button -->
  <g transform="translate(512 540) scale(1.12) translate(-548 -522)"><path d="M430 372 L430 652 Q430 690 463 671 L668 548 Q700 530 668 512 L463 391 Q430 372 430 372 Z" fill="url(#play)"/></g>
  <!-- Telestrator stroke: hand-drawn arc sweeping around the play button -->
  <g transform="translate(512 512) scale(1.07) translate(-512 -512)" filter="url(#glow)" fill="none" stroke="#ffc53d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 700 C 230 560, 300 330, 500 282 C 650 248, 770 330, 790 440" stroke-width="44"/>
    <path d="M722 410 L792 452 L826 372" stroke-width="44"/>
  </g>
</svg>
