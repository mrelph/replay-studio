name: Release

# Cuts a release when a `v*` tag is pushed (see RELEASING.md). Builds the
# Linux AppImage, Windows NSIS installer and macOS dmg (Apple silicon,
# ad-hoc signed, manual download only) and publishes them, plus the
# electron-updater feed files (latest-linux.yml / latest.yml), to a GitHub
# Release matching the tag. electron-updater on Linux and Windows machines
# reads that release to auto-update.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The three build jobs each publish to the GitHub Release for the tag. When
  # none exists yet they race to create it, and GitHub can end up with two
  # releases for one tag, each holding part of the files (this happened on
  # v1.9.1). Creating the release once, up front, removes the race.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "${GITHUB_REF_NAME#v}" --notes "" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}. Run 'npm version' to bump the version before tagging, or re-tag to match."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and publish
        run: npx vite build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID certificate yet: the mac build is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: false
